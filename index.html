<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0D3B1A">
<title>Bolão da Alegria ⚽</title>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, arrayUnion, onSnapshot, query, where, serverTimestamp, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  // Storage removido — comprovantes salvos como base64 no Firestore (evita CORS)

  // ─── FIREBASE CONFIG ─────────────────────────────────────────────────────────
  const firebaseConfig = {
    apiKey: "AIzaSyCWmI-VYCTqAKSSOCf2jhjM7CSzJFpyS30",
    authDomain: "bolaodaalegria-4f433.firebaseapp.com",
    projectId: "bolaodaalegria-4f433",
    storageBucket: "bolaodaalegria-4f433.firebasestorage.app",
    messagingSenderId: "357246060944",
    appId: "1:357246060944:web:f277e7017e68269f0a0b15",
    measurementId: "G-ME5QSPFD2X"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // ─── STATE ────────────────────────────────────────────────────────────────────
  let currentUser = null;
  let currentBolao = null;
  let unsubscribeBolao = null;
  let currentView = 'auth';

  // ─── UTILS ───────────────────────────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  const show = id => { const el = $(id); if(el) el.style.display = 'flex'; };
  const hide = id => { const el = $(id); if(el) el.style.display = 'none'; };
  const showBlock = id => { const el = $(id); if(el) el.style.display = 'block'; };
  const toast = (msg, type='info') => {
    const t = document.createElement('div');
    t.className = `toast toast-${type}`;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.classList.add('show'), 10);
    setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400); }, 3200);
  };
  const loading = (show) => {
    const el = $('loading-overlay');
    if(el) el.style.display = show ? 'flex' : 'none';
  };

  // ─── AUTH ─────────────────────────────────────────────────────────────────────
  onAuthStateChanged(auth, async user => {
    if (user) {
      currentUser = user;
      $('user-name-display').textContent = user.displayName || user.email.split('@')[0];
      $('user-email-display').textContent = user.email;
      showView('home');
      loadUserBoloes();
    } else {
      currentUser = null;
      showView('auth');
    }
  });

  window.registerUser = async () => {
    const name = $('reg-name').value.trim();
    const email = $('reg-email').value.trim();
    const pass = $('reg-pass').value;
    if (!name || !email || !pass) { toast('Preencha todos os campos','error'); return; }
    loading(true);
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: name });
      await setDoc(doc(db, 'users', cred.user.uid), { name, email, createdAt: serverTimestamp() });
      toast('Cadastro realizado! Bem-vindo!','success');
    } catch(e) {
      toast(firebaseError(e.code),'error');
    } finally { loading(false); }
  };

  window.loginUser = async () => {
    const email = $('login-email').value.trim();
    const pass = $('login-pass').value;
    if (!email || !pass) { toast('Preencha e-mail e senha','error'); return; }
    loading(true);
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch(e) {
      toast(firebaseError(e.code),'error');
    } finally { loading(false); }
  };

  window.logoutUser = async () => {
    if (unsubscribeBolao) unsubscribeBolao();
    await signOut(auth);
    toast('Até logo!','info');
  };

  // ─── NAVIGATION ──────────────────────────────────────────────────────────────
  window.showView = (view) => {
    document.querySelectorAll('.view').forEach(v => v.style.display='none');
    const el = $('view-'+view);
    if(el) el.style.display='block';
    currentView = view;
    if(view === 'home') loadUserBoloes();
  };

  window.showTab = (tab) => {
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.auth-panel').forEach(p => p.style.display='none');
    document.querySelector(`.auth-tab[onclick="showTab('${tab}')"]`).classList.add('active');
    $('panel-'+tab).style.display='block';
  };

  // ─── BOLÃO CRUD ──────────────────────────────────────────────────────────────
  window.createBolao = async () => {
    const name = $('b-name').value.trim();
    const team1 = $('b-team1').value.trim();
    const team2 = $('b-team2').value.trim();
    const date = $('b-date').value;
    const time = $('b-time').value;
    const valor = parseFloat($('b-valor').value);
    const pix = $('b-pix').value.trim();
    const emailsRaw = $('b-emails').value.trim();

    if (!name||!team1||!team2||!date||!time||!valor||!pix) {
      toast('Preencha todos os campos obrigatórios','error'); return;
    }

    loading(true);
    try {
      const gameDateTime = new Date(date + 'T' + time);
      const emails = emailsRaw ? emailsRaw.split(',').map(e=>e.trim()).filter(Boolean) : [];
      const bolaoRef = await addDoc(collection(db,'boloes'), {
        name, team1, team2,
        gameDateTime: gameDateTime.toISOString(),
        valorLance: valor,
        pixKey: pix,
        invitedEmails: emails,
        creatorId: currentUser.uid,
        creatorName: currentUser.displayName || currentUser.email,
        createdAt: serverTimestamp(),
        status: 'open', // open | closed | finished
        participants: [],
        lances: [],
        totalPago: 0,
        resultado: null,
        ganhadores: null,
        acumulado: 0
      });
      toast('Bolão criado com sucesso! 🎉','success');
      $('b-name').value=''; $('b-team1').value=''; $('b-team2').value='';
      $('b-date').value=''; $('b-time').value=''; $('b-valor').value='';
      $('b-pix').value=''; $('b-emails').value='';
      showView('home');
    } catch(e) {
      toast('Erro ao criar bolão: '+e.message,'error');
    } finally { loading(false); }
  };

  // ─── LOAD BOLÕES ─────────────────────────────────────────────────────────────
  window.loadUserBoloes = async () => {
    if (!currentUser) return;
    const container = $('boloes-list');
    if(!container) return;
    container.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';

    try {
      // bolões criados pelo user
      const q1 = query(collection(db,'boloes'), where('creatorId','==',currentUser.uid));
      // bolões onde o user participou
      const snap1 = await getDocs(q1);

      // todos os bolões para checar invited
      const allSnap = await getDocs(collection(db,'boloes'));
      const seen = new Set();
      const boloes = [];

      snap1.forEach(d => { if(!seen.has(d.id)){seen.add(d.id); boloes.push({id:d.id,...d.data()});} });
      allSnap.forEach(d => {
        if(seen.has(d.id)) return;
        const data = d.data();
        const isParticipant = (data.lances||[]).some(l=>l.userId===currentUser.uid);
        const isInvited = (data.invitedEmails||[]).includes(currentUser.email);
        if(isParticipant||isInvited){ seen.add(d.id); boloes.push({id:d.id,...data}); }
      });

      if(boloes.length===0){
        container.innerHTML = `<div class="empty-state"><span class="empty-icon">⚽</span><p>Nenhum bolão ainda.<br>Crie um ou aguarde um convite!</p></div>`;
        return;
      }
      container.innerHTML = boloes.map(b => renderBolaoCard(b)).join('');
    } catch(e) {
      container.innerHTML = '<p style="color:#ff6b6b;text-align:center">Erro ao carregar bolões</p>';
    }
  };

  function renderBolaoCard(b) {
    const gd = new Date(b.gameDateTime);
    const now = new Date();
    const diff = gd - now;
    const isCreator = b.creatorId === currentUser.uid;
    const totalLances = (b.lances||[]).length;
    const lancesPages = (b.lances||[]).filter(l=>l.pago).length;
    const participants = [...new Set((b.lances||[]).map(l=>l.userName))];
    let statusBadge = '';
    if(b.status==='finished') statusBadge = '<span class="badge badge-finished">Finalizado</span>';
    else if(b.status==='closed') statusBadge = '<span class="badge badge-closed">Encerrado</span>';
    else statusBadge = '<span class="badge badge-open">Aberto</span>';

    return `
    <div class="bolao-card" onclick="openBolao('${b.id}')">
      <div class="bolao-card-header">
        <span class="bolao-card-name">${b.name}</span>
        ${statusBadge}
      </div>
      <div class="bolao-vs">
        <span class="team-name">${b.team1}</span>
        <span class="vs-badge">VS</span>
        <span class="team-name">${b.team2}</span>
      </div>
      <div class="bolao-meta">
        <span>📅 ${gd.toLocaleDateString('pt-BR')} ${gd.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span>
        <span>💰 R$ ${b.valorLance?.toFixed(2)}</span>
      </div>
      <div class="bolao-stats-row">
        <div class="stat-mini"><span>${participants.length}</span><label>Apostadores</label></div>
        <div class="stat-mini"><span>${totalLances}</span><label>Lances</label></div>
        <div class="stat-mini"><span>${lancesPages}</span><label>Pagos</label></div>
        <div class="stat-mini"><span>R$${((totalLances)*(b.valorLance||0)+(b.acumulado||0)).toFixed(0)}</span><label>Total</label></div>
      </div>
      ${isCreator ? '<div class="creator-badge">👑 Você criou</div>' : ''}
    </div>`;
  }

  // ─── OPEN BOLÃO DETAIL ────────────────────────────────────────────────────────
  window.openBolao = async (bolaoId) => {
    loading(true);
    try {
      if(unsubscribeBolao) unsubscribeBolao();
      unsubscribeBolao = onSnapshot(doc(db,'boloes',bolaoId), snap => {
        if(!snap.exists()) { toast('Bolão não encontrado','error'); return; }
        currentBolao = {id: snap.id, ...snap.data()};
        renderBolaoDetail(currentBolao);
      });
      showView('bolao-detail');
    } catch(e) {
      toast('Erro ao abrir bolão','error');
    } finally { loading(false); }
  };

  function renderBolaoDetail(b) {
    const gd = new Date(b.gameDateTime);
    const now = new Date();
    const diff = gd - now;
    const minutos = Math.floor(diff/60000);
    const isCreator = b.creatorId === currentUser.uid;
    const lances = b.lances || [];
    const myLances = lances.filter(l=>l.userId===currentUser.uid);
    const participants = [...new Set(lances.map(l=>l.userName))];
    const totalPago = lances.filter(l=>l.pago).reduce((s,l)=>s+(b.valorLance||0),0) + (b.acumulado||0);
    const totalLances = lances.length;
    const lancesPageCount = lances.filter(l=>l.pago).length;

    // Deadline: 60 min antes
    const deadline = new Date(gd.getTime() - 60*60*1000);
    const apostaEncerrada = now >= deadline || b.status !== 'open';
    const canBet = !apostaEncerrada;

    const el = $('bolao-detail-content');
    if(!el) return;

    // Countdown
    let countdown = '';
    if(diff > 0) {
      const h = Math.floor(diff/3600000);
      const m = Math.floor((diff%3600000)/60000);
      countdown = `⏱ ${h}h ${m}min para o jogo`;
    } else {
      countdown = '🔴 Jogo em andamento / finalizado';
    }

    // Link de convite
    const link = `${location.href.split('?')[0]}?bolao=${b.id}`;

    el.innerHTML = `
    <div class="detail-header">
      <button class="btn-back" onclick="showView('home')">← Voltar</button>
      <div class="detail-title">${b.name}</div>
      <div class="detail-status">${countdown}</div>
    </div>

    <div class="vs-hero">
      <div class="team-hero">${b.team1}</div>
      <div class="vs-center">
        <div class="vs-big">VS</div>
        <div class="game-date">${gd.toLocaleDateString('pt-BR')} • ${gd.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div>
      </div>
      <div class="team-hero">${b.team2}</div>
    </div>

    <div class="info-grid">
      <div class="info-card">💰 Valor por lance<br><strong>R$ ${b.valorLance?.toFixed(2)}</strong></div>
      <div class="info-card">💳 PIX<br><strong>${b.pixKey}</strong></div>
    </div>

    <div class="stats-row">
      <div class="stat-box"><span class="stat-num">${participants.length}</span><span class="stat-label">Apostadores</span></div>
      <div class="stat-box"><span class="stat-num">${totalLances}</span><span class="stat-label">Lances</span></div>
      <div class="stat-box"><span class="stat-num">${lancesPageCount}</span><span class="stat-label">Pagos</span></div>
      <div class="stat-box total-box"><span class="stat-num">R$${totalPago.toFixed(0)}</span><span class="stat-label">Pot Total</span></div>
    </div>

    ${b.acumulado > 0 ? `<div class="acumulado-banner">🏆 Acumulado do bolão anterior: R$ ${b.acumulado.toFixed(2)}</div>` : ''}

    ${isCreator && !apostaEncerrada ? `
    <div class="share-section">
      <div class="share-title">📨 Convidar Participantes</div>
      <div class="share-link-box">
        <input type="text" readonly value="${link}" id="share-link-input">
        <button class="btn-copy" onclick="copyLink('${link}')">Copiar Link</button>
      </div>
      ${b.invitedEmails?.length ? `<div class="invited-list">Convidados: ${b.invitedEmails.join(', ')}</div>` : ''}
    </div>` : ''}

    ${!apostaEncerrada ? `<div class="deadline-info">⏰ Apostas encerram 60 min antes do jogo</div>` : ''}
    ${canBet ? `
    <div class="bet-section">
      <div class="section-title">⚽ Fazer Lance</div>
      <div class="bet-form">
        <label>Placar apostado</label>
        <div class="score-input-row">
          <div class="score-team">${b.team1}</div>
          <input type="number" id="score1" min="0" max="20" placeholder="0" class="score-input">
          <span class="score-sep">×</span>
          <input type="number" id="score2" min="0" max="20" placeholder="0" class="score-input">
          <div class="score-team">${b.team2}</div>
        </div>
        <button class="btn-primary" onclick="addLance()">+ Adicionar Lance (R$ ${b.valorLance?.toFixed(2)})</button>
      </div>
    </div>` : `<div class="apostaEncerrada">🔒 Apostas encerradas (60 min antes do jogo)</div>`}

    ${myLances.length > 0 ? `
    <div class="my-lances-section">
      <div class="section-title">Meus Lances</div>
      ${myLances.map((l,i) => `
      <div class="my-lance-card ${l.pago?'pago':'pendente'}">
        <div class="lance-placar">${b.team1} ${l.gol1} × ${l.gol2} ${b.team2}</div>
        <div class="lance-status">${l.pago ? '✅ Pago' : '⏳ Aguardando pagamento'}</div>
        ${!l.pago ? `
        <div class="pix-reminder">
          Transfira <strong>R$ ${b.valorLance?.toFixed(2)}</strong> para a chave PIX:<br>
          <span class="pix-key" onclick="copyPix('${b.pixKey}')">${b.pixKey} <span style="font-size:11px;color:var(--gold)">📋 copiar</span></span>
        </div>
        <div class="comprovante-upload">
          <input type="file" id="comp-${l.id}" accept="image/*,application/pdf" onchange="uploadComprovante('${b.id}','${l.id}',this)">
          <label for="comp-${l.id}" class="btn-upload">📎 Anexar Comprovante e Confirmar Pagamento</label>
          <div class="upload-hint">Anexar comprovante confirma o pagamento automaticamente</div>
        </div>
        <div class="divider-or">— ou —</div>
        <button class="btn-pago" onclick="confirmarPagamento('${b.id}','${l.id}')">✅ Confirmar Pagamento sem comprovante</button>
        ` : `
        <div class="comprovante-pago">
          ${l.comprovante ? `<button class="btn-ver-comp" onclick="verComprovante('${l.id}')">📄 Ver Comprovante</button>` : '<span style="font-size:12px;color:var(--gray-400)">Pago sem comprovante</span>'}
        </div>`}
      </div>`).join('')}
      ${myLances.every(l=>l.pago) && myLances.some(l=>!l.concluido) ? `
      <button class="btn-concluir" onclick="concluirApostas('${b.id}')">🏁 Concluir Minhas Apostas</button>` : ''}
      ${myLances.every(l=>l.concluido) ? '<div class="concluido-msg">✅ Suas apostas estão concluídas!</div>' : ''}
    </div>` : ''}

    <div class="participants-section">
      <div class="section-title">👥 Participantes (${participants.length})</div>
      ${participants.length===0 ? '<p class="empty-p">Nenhum lance ainda.</p>' :
        `<div class="participant-list">${participants.map(p=>`<span class="participant-chip">${p}</span>`).join('')}</div>`}
    </div>

    ${(b.status==='closed' || b.status==='finished') ? renderResultados(b) : ''}

    ${isCreator && b.status==='closed' ? `
    <div class="resultado-section">
      <div class="section-title">🏆 Informar Resultado Final</div>
      <div class="score-input-row">
        <div class="score-team">${b.team1}</div>
        <input type="number" id="res1" min="0" max="20" placeholder="0" class="score-input">
        <span class="score-sep">×</span>
        <input type="number" id="res2" min="0" max="20" placeholder="0" class="score-input">
        <div class="score-team">${b.team2}</div>
      </div>
      <button class="btn-primary btn-resultado" onclick="informarResultado('${b.id}')">🏆 Definir Ganhadores</button>
    </div>` : ''}

    ${isCreator && b.status==='open' ? `
    <div style="margin-top:16px">
      <button class="btn-danger" onclick="encerrarBolao('${b.id}')">🔒 Encerrar Bolão Manualmente</button>
    </div>` : ''}
    `;

    // Cronômetro regressivo
    startCountdown(gd, b.id);
  }

  function renderResultados(b) {
    if(b.status==='finished' && b.resultado) {
      const lances = b.lances||[];
      const pagos = lances.filter(l=>l.pago);
      const total = pagos.length * (b.valorLance||0) + (b.acumulado||0);

      return `
      <div class="resultado-final">
        <div class="resultado-title">🏆 RESULTADO FINAL</div>
        <div class="placar-final">${b.team1} <span>${b.resultado.gol1}</span> × <span>${b.resultado.gol2}</span> ${b.team2}</div>
        ${b.ganhadores?.length > 0 ? `
          <div class="ganhadores">
            <div>🎉 Ganhadores:</div>
            ${b.ganhadores.map(g=>`<div class="ganhador-chip">${g.name} — R$ ${g.valor?.toFixed(2)}</div>`).join('')}
          </div>` :
          `<div class="acumulou">😔 Ninguém acertou! R$ ${total.toFixed(2)} acumulado para o próximo bolão.</div>`}
        <div class="todos-lances"><div class="section-title" style="margin-top:16px">Todos os Placares Apostados</div>
        ${pagos.map(l=>`<div class="lance-resumo">${l.userName}: ${b.team1} ${l.gol1}×${l.gol2} ${b.team2}</div>`).join('')}
        </div>
      </div>`;
    }
    if(b.status==='closed') {
      const lances = b.lances||[];
      const pagos = lances.filter(l=>l.pago);
      const total = pagos.length * (b.valorLance||0) + (b.acumulado||0);
      return `
      <div class="resultado-parcial">
        <div class="section-title">📊 Apostas Encerradas — Aguardando resultado</div>
        <div class="total-acumulado">💰 Total em jogo: R$ ${total.toFixed(2)}</div>
        <div class="todos-lances">
        ${pagos.map(l=>`<div class="lance-resumo">${l.userName}: ${b.team1} ${l.gol1}×${l.gol2} ${b.team2}</div>`).join('')}
        </div>
      </div>`;
    }
    return '';
  }

  // ─── LANCES ──────────────────────────────────────────────────────────────────
  window.addLance = async () => {
    if(!currentBolao) return;
    const g1 = parseInt($('score1').value);
    const g2 = parseInt($('score2').value);
    if(isNaN(g1)||isNaN(g2)||g1<0||g2<0){toast('Informe o placar','error');return;}

    const now = new Date();
    const gd = new Date(currentBolao.gameDateTime);
    const deadline = new Date(gd.getTime()-60*60*1000);
    if(now>=deadline){toast('Apostas encerradas (60 min antes do jogo)','error');return;}

    loading(true);
    try {
      const lanceId = Date.now().toString(36) + Math.random().toString(36).slice(2);
      const lance = {
        id: lanceId,
        userId: currentUser.uid,
        userName: currentUser.displayName || currentUser.email.split('@')[0],
        userEmail: currentUser.email,
        gol1: g1, gol2: g2,
        pago: false, concluido: false,
        comprovante: null,
        timestamp: new Date().toISOString()
      };
      await updateDoc(doc(db,'boloes',currentBolao.id), { lances: arrayUnion(lance) });
      $('score1').value=''; $('score2').value='';
      toast('Lance adicionado! Não esqueça de pagar o PIX 💳','success');
    } catch(e) {
      toast('Erro ao adicionar lance','error');
    } finally { loading(false); }
  };

  window.confirmarPagamento = async (bolaoId, lanceId) => {
    loading(true);
    try {
      const snap = await getDoc(doc(db,'boloes',bolaoId));
      const b = snap.data();
      const lances = (b.lances||[]).map(l => l.id===lanceId ? {...l, pago:true} : l);
      await updateDoc(doc(db,'boloes',bolaoId),{lances});
      toast('Pagamento confirmado! ✅','success');
    } catch(e){ toast('Erro','error'); } finally { loading(false); }
  };

  window.uploadComprovante = async (bolaoId, lanceId, input) => {
    const file = input.files[0]; if(!file) return;

    // Limite de 1.5MB antes de comprimir
    if(file.size > 5 * 1024 * 1024) {
      toast('Arquivo muito grande. Use imagem menor que 5MB.','error'); return;
    }

    loading(true);
    try {
      // Comprime a imagem via Canvas antes de salvar no Firestore (sem Storage = sem CORS)
      const compressedBase64 = await compressImage(file, 800, 0.65);

      const snap = await getDoc(doc(db,'boloes',bolaoId));
      const b = snap.data();
      const lances = (b.lances||[]).map(l =>
        l.id===lanceId ? {...l, comprovante: compressedBase64, pago: true} : l
      );
      await updateDoc(doc(db,'boloes',bolaoId),{lances});
      toast('Comprovante enviado e pagamento confirmado! ✅','success');
    } catch(e) {
      console.error(e);
      toast('Erro ao enviar comprovante: '+e.message,'error');
    } finally { loading(false); }
  };

  // Comprime imagem via Canvas para caber no Firestore (max ~1MB base64)
  function compressImage(file, maxWidth, quality) {
    return new Promise((resolve, reject) => {
      // PDFs: salvar como base64 direto sem comprimir
      if(file.type === 'application/pdf') {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
        return;
      }
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = url;
    });
  }

  window.concluirApostas = async (bolaoId) => {
    loading(true);
    try {
      const snap = await getDoc(doc(db,'boloes',bolaoId));
      const b = snap.data();
      const lances = (b.lances||[]).map(l =>
        l.userId===currentUser.uid && l.pago ? {...l, concluido:true} : l
      );
      await updateDoc(doc(db,'boloes',bolaoId),{lances});
      // Check if all paid lances are concluded -> auto-close if 1h before game
      checkAutoClose(bolaoId, b, lances);
      toast('Apostas concluídas! Boa sorte! 🍀','success');
    } catch(e){ toast('Erro','error'); } finally { loading(false); }
  };

  async function checkAutoClose(bolaoId, b, lances) {
    const gd = new Date(b.gameDateTime);
    const deadline1h = new Date(gd.getTime()-60*60*1000);
    const now = new Date();
    const pagos = lances.filter(l=>l.pago);
    const allConcluded = pagos.length>0 && pagos.every(l=>l.concluido);
    if(allConcluded || now>=deadline1h) {
      await updateDoc(doc(db,'boloes',bolaoId),{status:'closed', lances});
    }
  }

  window.encerrarBolao = async (bolaoId) => {
    if(!confirm('Encerrar bolão manualmente?')) return;
    loading(true);
    try {
      await updateDoc(doc(db,'boloes',bolaoId),{status:'closed'});
      toast('Bolão encerrado','info');
    } catch(e){toast('Erro','error');} finally{loading(false);}
  };

  // ─── RESULTADO ───────────────────────────────────────────────────────────────
  window.informarResultado = async (bolaoId) => {
    const g1 = parseInt($('res1').value);
    const g2 = parseInt($('res2').value);
    if(isNaN(g1)||isNaN(g2)){toast('Informe o placar final','error');return;}
    loading(true);
    try {
      const snap = await getDoc(doc(db,'boloes',bolaoId));
      const b = snap.data();
      const lances = (b.lances||[]).filter(l=>l.pago);
      const total = lances.length*(b.valorLance||0)+(b.acumulado||0);

      // Acertadores
      const acertadores = lances.filter(l=>parseInt(l.gol1)===g1&&parseInt(l.gol2)===g2);

      let ganhadores = [];
      let acumulado = 0;

      if(acertadores.length>0){
        const valorPorGanhador = total/acertadores.length;
        ganhadores = acertadores.map(l=>({name:l.userName, email:l.userEmail, valor:valorPorGanhador}));
      } else {
        acumulado = total;
      }

      await updateDoc(doc(db,'boloes',bolaoId),{
        resultado:{gol1:g1,gol2:g2},
        ganhadores, acumulado,
        status:'finished'
      });

      toast(ganhadores.length>0 ? `🏆 ${ganhadores.length} ganhador(es) definido(s)!` : '😔 Acumulado para o próximo!','success');
    } catch(e){toast('Erro ao informar resultado','error');} finally{loading(false);}
  };

  // ─── COPY LINK & PIX ──────────────────────────────────────────────────────────
  window.copyLink = (link) => {
    navigator.clipboard.writeText(link).then(()=>toast('Link copiado! 📋','success'));
  };

  window.copyPix = (key) => {
    navigator.clipboard.writeText(key).then(()=>toast('Chave PIX copiada! 📋','success'));
  };

  // ─── VER COMPROVANTE (lightbox base64) ───────────────────────────────────────
  window.verComprovante = (lanceId) => {
    if(!currentBolao) return;
    const lance = (currentBolao.lances||[]).find(l=>l.id===lanceId);
    if(!lance?.comprovante) { toast('Comprovante não encontrado','error'); return; }

    // Remove lightbox existente
    const old = document.getElementById('lightbox-comp');
    if(old) old.remove();

    const isPdf = lance.comprovante.startsWith('data:application/pdf');
    const lb = document.createElement('div');
    lb.id = 'lightbox-comp';
    lb.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;';
    lb.innerHTML = isPdf
      ? `<iframe src="${lance.comprovante}" style="width:100%;max-width:500px;height:80vh;border-radius:12px;border:none;"></iframe>`
      : `<img src="${lance.comprovante}" style="max-width:100%;max-height:80vh;border-radius:12px;object-fit:contain;">`;
    lb.innerHTML += `<button onclick="document.getElementById('lightbox-comp').remove()"
      style="margin-top:16px;background:var(--gold);color:#111;border:none;border-radius:10px;padding:10px 28px;font-size:15px;font-weight:700;cursor:pointer;">✕ Fechar</button>`;
    document.body.appendChild(lb);
  };

  // ─── URL BOLÃO INVITE ─────────────────────────────────────────────────────────
  const urlParams = new URLSearchParams(location.search);
  const inviteBolaoId = urlParams.get('bolao');
  if(inviteBolaoId) {
    onAuthStateChanged(auth, user => {
      if(user) setTimeout(()=>openBolao(inviteBolaoId),500);
    });
  }

  // ─── COUNTDOWN ───────────────────────────────────────────────────────────────
  let countdownInterval = null;
  function startCountdown(gameDate, bolaoId) {
    if(countdownInterval) clearInterval(countdownInterval);
    countdownInterval = setInterval(()=>{
      const now = new Date();
      const diff = gameDate - now;
      const el = document.querySelector('.detail-status');
      if(!el) { clearInterval(countdownInterval); return; }
      if(diff<=0){ el.textContent='🔴 Jogo em andamento / finalizado'; clearInterval(countdownInterval); return; }
      const h=Math.floor(diff/3600000), m=Math.floor((diff%3600000)/60000), s=Math.floor((diff%60000)/1000);
      el.textContent=`⏱ ${h}h ${m}min ${s}s para o jogo`;
      // Auto-encerrar 60 min antes se status open
      if(diff<=3600000 && currentBolao?.status==='open'){
        updateDoc(doc(db,'boloes',bolaoId),{status:'closed'}).catch(()=>{});
      }
    },1000);
  }

  // ─── FIREBASE ERRORS PT ───────────────────────────────────────────────────────
  function firebaseError(code){
    const map={
      'auth/email-already-in-use':'E-mail já cadastrado',
      'auth/weak-password':'Senha fraca (min 6 caracteres)',
      'auth/invalid-email':'E-mail inválido',
      'auth/user-not-found':'Usuário não encontrado',
      'auth/wrong-password':'Senha incorreta',
      'auth/invalid-credential':'E-mail ou senha incorretos',
      'auth/too-many-requests':'Muitas tentativas. Tente mais tarde'
    };
    return map[code]||'Erro: '+code;
  }
</script>

    border-radius: 10px; padding: 12px 14px; font-size: 13px; font-weight: 600;
    color: var(--gold-dark); cursor: pointer; width: 100%; text-align: center;
    transition: background .2s;
  }
  .btn-upload:active { background: rgba(255,214,0,.22); }
  .upload-hint { font-size: 11px; color: var(--gray-400); text-align: center; margin-top: 5px; }
  .pix-key { display: inline-block; margin-top: 4px; cursor: pointer; font-weight: 700; color: var(--white); font-size: 14px; word-break: break-all; }
  .divider-or { text-align: center; color: var(--gray-400); font-size: 12px; margin: 8px 0; }
  .comprovante-pago { margin-top: 6px; }
  .btn-ver-comp { background: rgba(255,255,255,.08); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; font-size: 13px; color: var(--white); cursor: pointer; }
  .btn-pago { background: var(--green-mid); color: #fff; border: none; border-radius: 8px; padding: 9px 14px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; }
  .link-comp { font-size: 12px; color: var(--gold); text-decoration: none; }
  .btn-concluir { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: var(--dark); border: none; border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 8px; }
  .concluido-msg { text-align: center; color: var(--green-light); font-size: 13px; margin-top: 8px; }

  .participant-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .participant-chip { background: rgba(255,255,255,.07); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; font-size: 13px; }
  .empty-p { color: var(--gray-400); font-size: 13px; }

  .resultado-final { margin: 0 16px 12px; background: linear-gradient(135deg, #4A148C22, #7B1FA222); border: 1px solid rgba(156,39,176,.4); border-radius: 12px; padding: 16px; text-align: center; }
  .resultado-title { font-family: 'Bebas Neue'; font-size: 24px; color: var(--gold); letter-spacing: 2px; margin-bottom: 10px; }
  .placar-final { font-family: 'Bebas Neue'; font-size: 28px; margin-bottom: 12px; }
  .placar-final span { color: var(--gold); font-size: 36px; }
  .ganhadores { background: rgba(255,214,0,.1); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .ganhador-chip { background: var(--gold); color: var(--dark); display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 700; margin: 4px; }
  .acumulou { background: rgba(229,57,53,.1); border-radius: 10px; padding: 12px; font-size: 14px; }
  .lance-resumo { font-size: 13px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.05); color: var(--gray-200); }
  .resultado-parcial { margin: 0 16px 12px; background: rgba(255,152,0,.07); border: 1px solid rgba(255,152,0,.2); border-radius: 12px; padding: 14px; }
  .total-acumulado { font-size: 16px; font-weight: 700; color: var(--gold); margin-bottom: 12px; }
  .btn-resultado { margin-top: 12px; }

  /* ── BOTTOM NAV ── */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #0D1A0F; border-top: 1px solid var(--border); display: flex; z-index: 100; }
  .nav-btn { flex: 1; padding: 12px 0 8px; background: none; border: none; color: var(--gray-400); cursor: pointer; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 2px; transition: color .2s; }
  .nav-btn .icon { font-size: 22px; }
  .nav-btn.active, .nav-btn:hover { color: var(--gold); }

  /* ── MOBILE TOUCH ── */
  button, .btn-primary, .btn-back, .btn-logout, .btn-copy, .btn-pago, .btn-concluir, .btn-danger, .btn-new, .btn-upload, .nav-btn, .auth-tab {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    cursor: pointer;
  }
  /* Minimum touch target 44px (Apple HIG) */
  .nav-btn { min-height: 56px; }
  .btn-primary { min-height: 50px; }
  .btn-pago, .btn-concluir { min-height: 46px; }
  .form-group input, .form-group textarea {
    font-size: 16px; /* Prevent iOS zoom on focus */
    -webkit-appearance: none;
    appearance: none;
  }
  .score-input {
    font-size: 28px;
    -webkit-appearance: none;
    appearance: none;
  }
  /* Smooth scrolling on iOS */
  #view-home, #view-create, #view-bolao-detail {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* ── RESPONSIVE ── */
  @media(max-width:400px) {
    .team-hero { font-size: 20px; }
    .bolao-stats-row { flex-wrap: wrap; }
    .stat-mini { min-width: 70px; }
    .stats-row { flex-wrap: wrap; }
    .stat-box { min-width: calc(50% - 4px); }
    .info-grid { grid-template-columns: 1fr; }
    .form-row { grid-template-columns: 1fr; }
    .auth-logo h1 { font-size: 36px; }
    .detail-title { font-size: 22px; }
  }
  @media(min-width:600px) {
    .auth-card, .create-form { max-width: 480px; margin: 0 auto; }
    #view-home .home-content, #bolao-detail-content { max-width: 600px; margin: 0 auto; }
    .bolao-card { max-width: 560px; margin-left: auto; margin-right: auto; }
  }
</style>
</head>
<body>

<!-- Loading -->
<div id="loading-overlay"><div class="spinner"></div></div>

<!-- ─── AUTH VIEW ───────────────────────────────────────────────── -->
<div class="view" id="view-auth" style="display:flex">
  <div class="auth-logo">
    <span class="ball">⚽</span>
    <h1>Bolão da Alegria</h1>
    <p>O bolão mais animado da Copa!</p>
  </div>
  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="showTab('login')">Entrar</button>
      <button class="auth-tab" onclick="showTab('register')">Cadastrar</button>
    </div>

    <div class="auth-panel" id="panel-login" style="display:block">
      <div class="form-group"><label>E-mail</label><input type="email" id="login-email" placeholder="seu@email.com"></div>
      <div class="form-group"><label>Senha</label><input type="password" id="login-pass" placeholder="••••••••"></div>
      <button class="btn-primary" onclick="loginUser()">Entrar ⚽</button>
    </div>

    <div class="auth-panel" id="panel-register">
      <div class="form-group"><label>Nome</label><input type="text" id="reg-name" placeholder="Seu nome"></div>
      <div class="form-group"><label>E-mail</label><input type="email" id="reg-email" placeholder="seu@email.com"></div>
      <div class="form-group"><label>Senha</label><input type="password" id="reg-pass" placeholder="Mínimo 6 caracteres"></div>
      <button class="btn-primary" onclick="registerUser()">Criar Conta 🎉</button>
    </div>
  </div>

  <div style="margin-top:20px;text-align:center;color:var(--gray-400);font-size:12px;padding:0 20px">
    ⚠️ Para ativar o app, substitua as credenciais do Firebase no código.<br>
    <a href="https://console.firebase.google.com" target="_blank" style="color:var(--gold)">console.firebase.google.com</a>
  </div>
</div>

<!-- ─── HOME VIEW ──────────────────────────────────────────────── -->
<div class="view" id="view-home">
  <div class="top-bar">
    <div class="top-bar-row">
      <div class="app-title">⚽ Bolão da Alegria</div>
      <div class="user-info">
        <div class="name" id="user-name-display">—</div>
        <div class="email" id="user-email-display">—</div>
        <button class="btn-logout" onclick="logoutUser()">Sair</button>
      </div>
    </div>
  </div>
  <div class="home-content">
    <div class="section-header">
      <h2>Meus Bolões</h2>
      <button class="btn-new" onclick="showView('create')">+ Novo Bolão</button>
    </div>
    <div id="boloes-list">
      <div class="loading-dots"><span></span><span></span><span></span></div>
    </div>
  </div>
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="showView('home')"><span class="icon">🏠</span>Início</button>
    <button class="nav-btn" onclick="showView('create')"><span class="icon">➕</span>Criar Bolão</button>
    <button class="nav-btn" onclick="loadUserBoloes();showView('home')"><span class="icon">🔄</span>Atualizar</button>
  </nav>
</div>

<!-- ─── CREATE BOLÃO VIEW ──────────────────────────────────────── -->
<div class="view" id="view-create">
  <div class="view-header">
    <button class="btn-back" onclick="showView('home')">←</button>
    <h2>⚽ Criar Novo Bolão</h2>
  </div>
  <div class="create-form">
    <div class="form-group"><label>Nome do Bolão *</label><input type="text" id="b-name" placeholder="Ex: Bolão da Galera — Brasil x Argentina"></div>
    <div class="form-row">
      <div class="form-group"><label>Time 1 *</label><input type="text" id="b-team1" placeholder="Brasil"></div>
      <div class="form-group"><label>Time 2 *</label><input type="text" id="b-team2" placeholder="Argentina"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Data do Jogo *</label><input type="date" id="b-date"></div>
      <div class="form-group"><label>Horário *</label><input type="time" id="b-time"></div>
    </div>
    <div class="form-group"><label>Valor por Lance (R$) *</label><input type="number" id="b-valor" placeholder="10.00" step="0.01" min="0.01"></div>
    <div class="form-group"><label>Chave PIX para pagamento *</label><input type="text" id="b-pix" placeholder="CPF, e-mail, telefone ou chave aleatória"></div>
    <div class="form-group"><label>E-mails dos convidados (separados por vírgula)</label><textarea id="b-emails" placeholder="amigo@email.com, outra@email.com"></textarea></div>
    <button class="btn-primary" onclick="createBolao()">🎉 Criar Bolão</button>
    <br><br>
  </div>
</div>

<!-- ─── BOLÃO DETAIL VIEW ──────────────────────────────────────── -->
<div class="view" id="view-bolao-detail">
  <div id="bolao-detail-content">
    <div class="loading-dots" style="padding:60px"><span></span><span></span><span></span></div>
  </div>
</div>

<script>
  // Inicializa tab
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('panel-login').style.display = 'block';
  });
</script>
</body>
</html>
